name: Android APK

# Builds an installable debug APK on GitHub's runners (this sandbox has no
# Android SDK, so the build has to happen here). The APK is uploaded as a
# workflow artifact and, on manual runs, attached to a GitHub Release so it can
# be downloaded straight to a phone.
#
#   gh workflow run android-apk.yml --ref <branch>

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the APK to a GitHub Release"
        type: boolean
        default: true
  push:
    branches:
      - "arena/2b6608d3-gallirent"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # Public client values: safe to embed in the APK. Override with repo
      # secrets if the project changes.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://lgslrcyaztmdosqznkjf.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_tmQvJQyWYriSaEi-UbRk_g_-rlvkwSq' }}
      # Google's sample AdMob IDs: fine for a test APK, never for production.
      EXPO_PUBLIC_ADMOB_ANDROID_APP_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_ANDROID_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
      EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_UNIT_ID || 'ca-app-pub-3940256099942544/6300978111' }}
      EXPO_PUBLIC_ADMOB_REWARDED_UNIT_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_REWARDED_UNIT_ID || 'ca-app-pub-3940256099942544/5224354917' }}
      # Android Maps SDK key. Public by design (it ships in the APK), protected
      # by the package + SHA-1 restrictions on the Google Cloud key.
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || 'AIzaSyC3cn95kgQiT7AxHiX-qAaNItBZn5uaK2A' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; installing it
      # again via an action is what broke the first run.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" || true
          java -version

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # One ABI instead of four: a universal APK carries native libs for
      # arm64-v8a, armeabi-v7a, x86 and x86_64 (~4x the size). Real phones are
      # arm64; x86 builds are only for emulators.
      - name: Trim to arm64
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          grep -n 'reactNativeArchitectures' android/gradle.properties

      # Release, not debug: a debug APK ships no JS bundle and dies with
      # "Unable to load script" because it expects a Metro server.
      #
      # Signing: add these repo secrets and the APK/AAB become Play-ready.
      # Without them the build falls back to Expo's debug keystore.
      #   ANDROID_KEYSTORE_BASE64  base64 of the .jks file
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Prepare release signing
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore loaded — artifacts will be properly signed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — signing with the debug keystore."
          fi

      - name: Build release APK and AAB
        working-directory: android
        env:
          KS_PATH: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ARGS=""
          if [ "$SIGNED" = "true" ]; then
            ARGS="-Pandroid.injected.signing.store.file=$KS_PATH -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          fi
          ./gradlew assembleRelease bundleRelease $ARGS --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log

      # Sandbox-side log access is blocked for this repo's Actions, so failures
      # are echoed to issue #1 where they can be read back.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$GITHUB_WORKSPACE/gradle-build.log"
          {
            echo "Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f "$LOG" ]; then
              echo '```'
              tail -n 250 "$LOG" | tail -c 55000
              echo '```'
            else
              echo "No gradle log produced (failed before the build step)."
            fi
          } > /tmp/body.md
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/body.md || true

      - name: Collect APK and AAB
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$SRC"
          OUT="GalliRent-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          AAB_SRC=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n 1 || true)
          if [ -n "$AAB_SRC" ]; then
            cp "$AAB_SRC" "GalliRent-${GITHUB_RUN_NUMBER}.aab"
          fi
          ls -lh GalliRent-${GITHUB_RUN_NUMBER}.*
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$OUT" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallirent-apk
          path: |
            ${{ steps.apk.outputs.path }}
            GalliRent-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GalliRent test APK #${{ github.run_number }}
          body: |
            Release-mode APK (JS bundle embedded, so it runs without Metro) built from `${{ github.sha }}`.

            Install on Android: allow "install unknown apps" for your browser/file manager, then open the APK.
            Signed with the CI debug keystore — fine for testing, not for a Play Store upload.
          files: |
            ${{ steps.apk.outputs.path }}
            GalliRent-*.aab
          draft: false
          prerelease: true
